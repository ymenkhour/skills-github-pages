<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }}</title>
  
  <!-- Homebrewery Core & 5e PHB Styles -->
  <link rel="stylesheet" href="{{ '/assets/css/bundle.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/blank.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/5ePHB.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/5e24PHB.css' | relative_url }}">
  
  <!-- Optional: FontAwesome for icons -->
  <link rel="stylesheet" href="https://cloudflare.com">
</head>
<body>
  <div class="brewRenderer">
    <div class="pages">
      <!-- Each .page div represents one physical US Letter/A4 sheet -->
      <div class="page" id="p1">
        <div class="columnWrapper">
          {{ content }}
        </div>
      </div>
    </div>
  </div>
</body>
</html>
